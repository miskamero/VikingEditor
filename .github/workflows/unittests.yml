name: Unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unittests-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: Windows / Python 3.11
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unittest suite
        run: python -m unittest discover -s tests -t . -v

      - name: Build frozen icon dependency check
        run: python -m PyInstaller --noconfirm --onefile --additional-hooks-dir packaging/hooks --distpath build/frozen-check --workpath build/frozen-check-work --specpath build tools/checkFrozenIcons.py

      - name: Check frozen icon dependencies
        run: .\build\frozen-check\checkFrozenIcons.exe
